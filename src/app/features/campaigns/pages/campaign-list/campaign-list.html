<section class="campaign-list-page">

  <div class="page-header">

    <div>
      <h1>
        Campaigns
      </h1>

      <p>
        Manage submarine campaigns
        and operational activity.
      </p>
    </div>

  </div>

  @if (loading()) {

    <div class="loading-state">

      <mat-spinner
        diameter="48"
      ></mat-spinner>

    </div>

  } @else if (loadError()) {

    <div class="error-state">

      Unable to load campaigns.

    </div>

  } @else {

    <div class="table-container">

      <table
        mat-table
        [dataSource]="campaigns()"
      >

        <ng-container
          matColumnDef="id"
        >

          <th
            mat-header-cell
            *matHeaderCellDef
          >
            ID
          </th>

          <td
            mat-cell
            *matCellDef="let campaign"
          >
            {{ campaign.id }}
          </td>

        </ng-container>

        <ng-container
          matColumnDef="name"
        >

          <th
            mat-header-cell
            *matHeaderCellDef
          >
            Name
          </th>

          <td
            mat-cell
            *matCellDef="let campaign"
          >
            <strong>
              {{ campaign.name }}
            </strong>
          </td>

        </ng-container>

        <ng-container
          matColumnDef="startDate"
        >

          <th
            mat-header-cell
            *matHeaderCellDef
          >
            Start date
          </th>

          <td
            mat-cell
            *matCellDef="let campaign"
          >
            {{
              campaign.startDate
                | date:'dd MMM yyyy'
            }}
          </td>

        </ng-container>

        <ng-container
          matColumnDef="status"
        >

          <th
            mat-header-cell
            *matHeaderCellDef
          >
            Status
          </th>

          <td
            mat-cell
            *matCellDef="let campaign"
          >

            <mat-chip>
              {{ campaign.status }}
            </mat-chip>

          </td>

        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="
            displayedColumns
          "
        ></tr>

        <tr
          mat-row
          *matRowDef="
            let row;
            columns: displayedColumns
          "
        ></tr>

      </table>

      <mat-paginator
        [length]="totalElements()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[
          5,
          10,
          25
        ]"
        (page)="onPageChange($event)"
      >
      </mat-paginator>

    </div>

  }

</section>
